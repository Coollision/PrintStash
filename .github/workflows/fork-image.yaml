name: fork-image

# Builds the unified image for this fork, with the external web slicer
# (printflow) baked into the frontend. Upstream images do not carry it.
on:
  push:
    branches: [feat/external-web-slicer]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/printstash-unified

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend with external slicer
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: printstash-frontend:fork
          build-args: |
            VITE_EXTERNAL_SLICER_NAME=PrintFlow
            VITE_EXTERNAL_SLICER_URL=${{ vars.EXTERNAL_SLICER_URL || 'https://printflow.declerck.dev/slice?file={file}' }}
            VITE_EXTERNAL_SLICER_TYPES=stl,3mf,obj,step

      - name: Build API
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: printstash-api:fork
          build-args: |
            PRINTSTASH_VARIANT=full

      - name: Build and push unified image
        uses: docker/build-push-action@v6
        with:
          context: backend/unified
          push: true
          build-contexts: |
            api-image=docker-image://printstash-api:fork
            frontend-image=docker-image://printstash-frontend:fork
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
