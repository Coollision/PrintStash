name: fork-image

# Builds the unified image for this fork, with the external web slicer
# (printflow) baked into the frontend. Upstream images do not carry it.
# Uses the repo's own bake file so the api/frontend targets resolve as build
# contexts locally instead of being pulled from a registry.
on:
  push:
    branches: [feat/external-web-slicer]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          targets: unified
          push: true
          set: |
            frontend.args.VITE_EXTERNAL_SLICER_NAME=PrintFlow
            frontend.args.VITE_EXTERNAL_SLICER_URL=https://printflow.declerck.dev/slice?file={file}
            frontend.args.VITE_EXTERNAL_SLICER_TYPES=stl,3mf,obj,step
            unified.tags=ghcr.io/coollision/printstash-unified:latest
